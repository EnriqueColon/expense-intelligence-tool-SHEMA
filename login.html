<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHEMA — Sign In</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; background: #f0f4f8; }
    .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: white; border-radius: 16px; padding: 2.75rem 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
    .login-brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
    .login-heading { font-size: 1.35rem; font-weight: 700; color: #1a202c; margin-bottom: 0.3rem; }
    .login-sub { font-size: 0.875rem; color: #64748b; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: #374151; margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; color: #1a202c; background: #f8fafc; transition: border-color 0.15s, box-shadow 0.15s; }
    .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); background: white; }
    .btn-login { width: 100%; padding: 0.78rem; font-size: 0.95rem; border-radius: 8px; margin-top: 0.5rem; }
    .login-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 0.7rem 0.9rem; border-radius: 7px; font-size: 0.85rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-mark">S</span>
        <div>
          <div class="logo-title">SHEMA</div>
          <div class="logo-sub">Expense Intelligence Tool</div>
        </div>
      </div>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-heading">Welcome back</div>
      <div class="login-sub">Sign in to access the expense dashboard</div>
      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-login" id="submit-btn">Sign In</button>
        <div class="login-error hidden" id="login-error"></div>
      </form>
    </div>
  </div>

  <script src="/static/login.js"></script>
</body>
</html>
